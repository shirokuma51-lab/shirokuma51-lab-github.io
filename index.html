<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>猫の神経衰弱｜配信表示</title>
    <link rel="stylesheet" href="css/display.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  </head>
  <body>
    <main id="game">
      <button
        id="startBtn"
        class="image-button btn-interactive"
        aria-label="開始"
      >
        <img src="assets/images/start.png" alt="開始" /></button
      ><button
        id="resetBtn"
        class="image-button btn-interactive"
        aria-label="カードをリセット"
      >
        <img src="assets/images/reset.png" alt="リセット" />
      </button>
      <div id="displayStatus" role="status"></div>
      <div id="memory"></div>
      <div id="comboDisplay"></div>
      <figure id="cardPreview" hidden aria-live="polite">
        <img alt="選択したカードの表面" />
        <figcaption></figcaption>
      </figure>
    </main>
    <script type="module" src="js/display.js"></script>
  </body>
</html>
